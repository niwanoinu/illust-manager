<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>イラスト制作管理</title>

<!-- ===== PWA関連の設定 ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a5a34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="イラスト管理">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- ===== CSS読み込み（今は1つだけ。今後ページごとに増やす予定） ===== -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== 上部バー：タイトル＋ナビゲーション ===== -->
  <header id="topbar">
    <div id="topbar-title">イラスト管理</div>
    <nav id="nav">
      <button class="nav-item" data-page="home">ホーム</button>
      <button class="nav-item" data-page="ideas">アイデア</button>
      <button class="nav-item" data-page="production">制作管理</button>
    </nav>
  </header>

  <!-- ===== メインコンテンツ：ページはここに追加していく ===== -->
  <main id="main">

    <section class="page" id="page-home">
      <h2>ホーム</h2>
      <p>ここがホーム画面です。今後、統計やダッシュボードなど全体を見渡す内容をここに置く予定です。</p>
    </section>

    <section class="page" id="page-ideas">
      <h2>アイデアメモ</h2>

      <form id="idea-form" class="idea-form">
        <input type="text" id="idea-input" class="idea-input" placeholder="思いついたアイデアを入力…" autocomplete="off">
        <button type="submit" class="btn-primary">追加</button>
      </form>

      <ul id="idea-list" class="idea-list"></ul>
    </section>

    <section class="page" id="page-production">
      <div class="page-header">
        <h2>制作管理</h2>
        <button type="button" class="btn-primary" onclick="openAddWorkModal()">＋ 追加</button>
      </div>
      <p class="hint-text">カードを左右にスワイプすると工程を移動できます。タップすると詳細を編集できます。</p>
      <div class="kanban-wrap" id="kanban-wrap"></div>
    </section>

  </main>

</div>

<!-- ===== モーダル表示用の入れ物（追加・編集フォームなどをここに描画） ===== -->
<div id="modal-root"></div>

<!-- ===== JS読み込み：機能ごとにファイルを分割 ===== -->
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/modal.js"></script>
<script src="js/ideas.js"></script>
<script src="js/production.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>

</body>
</html>
